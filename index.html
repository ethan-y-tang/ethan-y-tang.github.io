<!DOCTYPE html>
<html dir="ltr" lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fff">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>blossom.is-a-good.dev</title>
  <style>
a { color: var(--link-color); }
body {
  --background-color: #fff;
  --google-blue-600: rgb(26, 115, 232);
  --google-blue-700: rgb(25, 103, 210);
  --google-gray-50: rgb(248, 249, 250);
  --google-gray-300: rgb(218, 220, 224);
  --google-gray-500: rgb(154, 160, 166);
  --google-gray-600: rgb(128, 134, 139);
  --google-gray-700: rgb(95, 99, 104);
  --google-gray-800: rgb(60, 64, 67);
  --google-gray-900: rgb(32, 33, 36);
  --heading-color: var(--google-gray-900);
  --link-color: rgb(88, 88, 88);
  --primary-button-fill-color: var(--google-blue-600);
  --primary-button-fill-color-active: var(--google-blue-700);
  --primary-button-text-color: #fff;
  --secondary-button-border-color: var(--google-gray-500);
  --secondary-button-fill-color: #fff;
  --secondary-button-hover-border-color: var(--google-gray-600);
  --secondary-button-hover-fill-color: var(--google-gray-50);
  --secondary-button-text-color: var(--google-gray-700);
  --small-link-color: var(--google-gray-700);
  --text-color: var(--google-gray-700);
  --error-code-color: var(--google-gray-700);
  background: var(--background-color);
  color: var(--text-color);
  word-wrap: break-word;
  font-family: 'Segoe UI', Tahoma, sans-serif;
  font-size: 75%;
}
html { -webkit-text-size-adjust: 100%; font-size: 125%; }
h1 { color: var(--heading-color); font-size: 1.6em; font-weight: normal; line-height: 1.25em; margin-bottom: 16px; margin-top: 0; word-wrap: break-word; }
a { text-decoration: none; }
button {
  border: 0; border-radius: 20px; box-sizing: border-box;
  color: var(--primary-button-text-color); cursor: pointer;
  float: right; font-size: .875em; margin: 0; padding: 8px 16px;
  background: var(--primary-button-fill-color);
}
.error-code { color: var(--error-code-color); font-size: .8em; margin-top: 12px; text-transform: uppercase; }
.interstitial-wrapper { box-sizing: border-box; font-size: 1em; line-height: 1.6em; margin: 14vh auto 0; max-width: 600px; width: 100%; }
.nav-wrapper { margin-top: 51px; }
.nav-wrapper::after { clear: both; content: ''; display: table; width: 100%; }
#suggestions-list a { color: var(--google-blue-600); }
#suggestions-list p { margin-block-end: 0; }
#suggestions-list ul { margin-top: 0; }
.single-suggestion { list-style-type: none; padding-inline-start: 0; }
.icon { height: 72px; margin: 0 0 40px; width: 72px; background-repeat: no-repeat; background-size: 100%; -webkit-user-select: none; display: inline-block; }
.icon-generic {
  content: image-set(
    url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEgAAABIAQMAAABvIyEEAAAABlBMVEUAAABTU1OoaSf/AAAAAXRSTlMAQObYZgAAAENJREFUeF7tzbEJACEQRNGBLeAasBCza2lLEGx0CxFGG9hBMDDxRy/72O9FMnIFapGylsu1fgoBdkXfUHLrQgdfrlJN1BdYBjQQm3UAAAAASUVORK5CYII=) 1x,
    url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJAAAACQAQMAAADdiHD7AAAABlBMVEUAAABTU1OoaSf/AAAAAXRSTlMAQObYZgAAAFJJREFUeF7t0cENgDAMQ9FwYgxG6WjpaIzCCAxQxVggFuDiCvlLOeRdHR9yzjncHVoq3npu+wQUrUuJHylSTmBaespJyJQoObUeyxDQb3bEm5Au81c0pSCD8HYAAAAASUVORK5CYII=) 2x);
}
/* Hide the sub-frame error entirely */
#sub-frame-error { display: none !important; }
@media (prefers-color-scheme: dark) {
  body {
    --background-color: var(--google-gray-900);
    --error-code-color: var(--google-gray-500);
    --heading-color: var(--google-gray-500);
    --link-color: rgb(138, 180, 248);
    --primary-button-fill-color: rgb(138, 180, 248);
    --primary-button-text-color: var(--google-gray-900);
    --text-color: var(--google-gray-500);
  }
  #suggestions-list a { color: var(--link-color); }
}
  </style>
</head>
<body class="neterror">
  <div id="content">
    <div id="main-frame-error" class="interstitial-wrapper">
      <div id="main-content">
        <div class="icon icon-generic"></div>
        <div id="main-message">
          <h1><span>This site can't be reached</span></h1>
          <p>Check if there is a typo in <span>blossom.is-a-good.dev</span>.</p>
          <div id="suggestions-list">
            <p></p>
            <ul class="single-suggestion">
              <li>If spelling is correct, <a href="javascript:void(0)" id="diagnose-link">try running Windows Network Diagnostics</a>.</li>
            </ul>
          </div>
          <div class="error-code">DNS_PROBE_FINISHED_NXDOMAIN</div>
        </div>
      </div>
      <div id="buttons" class="nav-wrapper">
        <div id="control-buttons">
          <button id="reload-button" onclick="window.location.href='https://blossom.is-a-good.dev/blossom'">Reload</button>
        </div>
      </div>
    </div>
  </div>
</body></html>
